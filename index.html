<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesapegaAí</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
      padding-bottom: 85px;
    }

    header {
      background: #ff6500;
      color: white;
      padding: 30px 20px 25px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .search {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      outline: none;
    }

    main {
      padding: 25px 18px;
    }

    .titulo {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .produto {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px #00000012;
    }

    .produto-img {
      width: 100%;
      height: 180px;
      background: #eee;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 70px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .produto-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .produto h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .preco {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .botao {
      background: #ff6500;
      color: white;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }

    .botao:hover {
      background: #e95600;
    }

    .tela {
      display: none;
    }

    .tela.ativa {
      display: block;
    }

    .formulario {
      background: white;
      padding: 20px;
      border-radius: 20px;
    }

    .formulario label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    .formulario input,
    .formulario textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .formulario textarea {
      height: 110px;
      resize: vertical;
    }

    .voltar {
      background: #ddd;
      color: #222;
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .mensagem {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      box-shadow: 0 -3px 15px #00000018;
      z-index: 100;
    }

    nav button {
      background: transparent;
      font-size: 14px;
      color: #333;
      padding: 7px;
    }

    nav button strong {
      display: block;
      font-size: 25px;
      margin-bottom: 3px;
    }

    .sem-produtos {
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>DesapegaAí</h1>
    <p>Compre, venda e desapegue.</p>

    <input
      class="search"
      id="pesquisa"
      type="search"
      placeholder="🔎 O que você procura?"
      oninput="pesquisarProdutos()"
    >
  </header>

  <main>

    <!-- INÍCIO -->
    <section id="inicio" class="tela ativa">
      <h2 class="titulo">🛍️ Produtos</h2>
      <div id="listaProdutos"></div>
    </section>

    <!-- VENDER -->
    <section id="vender" class="tela">
      <button class="voltar" onclick="mostrarTela('inicio')">
        ← Voltar
      </button>

      <h2 class="titulo">➕ Vender produto</h2>

      <div class="formulario">
        <label>Nome do produto</label>
        <input id="nomeProduto" type="text" placeholder="Ex.: Celular usado">

        <label>Preço</label>
        <input id="precoProduto" type="number" placeholder="Ex.: 700">

        <label>Descrição</label>
        <textarea id="descricaoProduto"
          placeholder="Conte um pouco sobre o produto"></textarea>

        <label>Imagem do produto</label>
        <input id="imagemProduto" type="file" accept="image/*">

        <br><br>

        <button class="botao" onclick="publicarProduto()">
          🚀 Publicar produto
        </button>
      </div>
    </section>

    <!-- CHAT -->
    <section id="chat" class="tela">
      <h2 class="titulo">💬 Chat</h2>

      <div class="mensagem">
        <h2>Seu chat</h2>
        <br>
        <p>Quando você iniciar uma conversa com um vendedor, ela aparecerá aqui.</p>
      </div>
    </section>

    <!-- PERFIL -->
    <section id="perfil" class="tela">
      <h2 class="titulo">👤 Perfil</h2>

      <div class="mensagem">
        <h2>Meu perfil</h2>
        <br>
        <p>Entre com sua conta para administrar seus produtos.</p>
        <br>
        <button class="botao" onclick="alert('Área de login em construção!')">
          Entrar
        </button>
      </div>
    </section>

  </main>

  <!-- MENU -->
  <nav>
    <button onclick="mostrarTela('inicio')">
      <strong>🏠</strong>
      Início
    </button>

    <button onclick="mostrarTela('chat')">
      <strong>💬</strong>
      Chat
    </button>

    <button onclick="mostrarTela('vender')">
      <strong>➕</strong>
      Vender
    </button>

    <button onclick="mostrarTela('perfil')">
      <strong>👤</strong>
      Perfil
    </button>
  </nav>

  <script>

    let produtos = [
      {
        nome: "Celular usado",
        preco: 700,
        descricao: "Celular usado em bom estado.",
        emoji: "📱"
      },
      {
        nome: "Bicicleta usada",
        preco: 450,
        descricao: "Bicicleta usada em bom estado.",
        emoji: "🚲"
      }
    ];

    function salvarProdutos() {
      localStorage.setItem(
        "desapegai_produtos",
        JSON.stringify(produtos)
      );
    }

    function carregarProdutos() {
      const salvos = localStorage.getItem("desapegai_produtos");

      if (salvos) {
        produtos = JSON.parse(salvos);
      }

      mostrarProdutos(produtos);
    }

    function mostrarProdutos(lista) {

      const area = document.getElementById("listaProdutos");

      area.innerHTML = "";

      if (lista.length === 0) {
        area.innerHTML = `
          <div class="sem-produtos">
            <h3>Nenhum produto encontrado.</h3>
            <br>
            <p>Tente pesquisar outro produto.</p>
          </div>
        `;
        return;
      }

      lista.forEach((produto, indice) => {

        let imagem = produto.imagem
          ? `<img src="${produto.imagem}" alt="${produto.nome}">`
          : produto.emoji || "📦";

        area.innerHTML += `
          <article class="produto">

            <div class="produto-img">
              ${imagem}
            </div>

            <h2>${produto.nome}</h2>

            <p style="color:#666;margin-bottom:10px;">
              ${produto.descricao || ""}
            </p>

            <div class="preco">
              R$ ${Number(produto.preco)
                .toFixed(2)
                .replace(".", ",")}
            </div>

            <button class="botao"
              onclick="falarComVendedor('${produto.nome.replace(/'/g, "\\'")}')">
              💬 Falar com vendedor
            </button>

          </article>
        `;
      });
    }

    function pesquisarProdutos() {

      const texto = document
        .getElementById("pesquisa")
        .value
        .toLowerCase();

      const resultado = produtos.filter(produto =>
        produto.nome.toLowerCase().includes(texto) ||
        (produto.descricao || "").toLowerCase().includes(texto)
      );

      mostrarProdutos(resultado);
    }

    function mostrarTela(nome) {

      document.querySelectorAll(".tela").forEach(tela => {
        tela.classList.remove("ativa");
      });

      document.getElementById(nome).classList.add("ativa");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function falarComVendedor(nome) {

      mostrarTela("chat");

      alert(
        "Conversa sobre: " + nome +
        "\\n\\nO sistema de mensagens será aberto aqui."
      );
    }

    function publicarProduto() {

      const nome =
        document.getElementById("nomeProduto").value.trim();

      const preco =
        document.getElementById("precoProduto").value;

      const descricao =
        document.getElementById("descricaoProduto").value.trim();

      const arquivo =
        document.getElementById("imagemProduto").files[0];

      if (!nome || !preco) {
        alert("Digite o nome e o preço do produto.");
        return;
      }

      if (arquivo) {

        const leitor = new FileReader();

        leitor.onload = function(e) {

          adicionarProduto(
            nome,
            preco,
            descricao,
            e.target.result
          );

        };

        leitor.readAsDataURL(arquivo);

      } else {

        adicionarProduto(
          nome,
          preco,
          descricao,
          ""
        );

      }
    }

    function adicionarProduto(
      nome,
      preco,
      descricao,
      imagem
    ) {

      produtos.unshift({
        nome: nome,
        preco: Number(preco),
        descricao: descricao,
        imagem: imagem,
        emoji: "📦"
      });

      salvarProdutos();

      document.getElementById("nomeProduto").value = "";
      document.getElementById("precoProduto").value = "";
      document.getElementById("descricaoProduto").value = "";
      document.getElementById("imagemProduto").value = "";

      mostrarProdutos(produtos);
      mostrarTela("inicio");

      alert("Produto publicado com sucesso! 🎉");
    }

    carregarProdutos();

  </script>

</body>
</html>
