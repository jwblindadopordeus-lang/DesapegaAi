    .chat-enviar {

    .chat-enviar input {

  </style>

<body>

<header>
  <h1>DesapegaAí</h1>
  <p>Compre, venda e desapegue.</p>

  <input

    type="search"

  >
</header>

<main>

  <!-- INÍCIO -->
  <section id="inicio" class="tela ativa">

    <div class="titulo">

  </section>


  <!-- VENDER -->
  <section id="vender" class="tela">

    <div class="titulo">

    <div class="formulario">

      <label>Nome do produto</label>

        placeholder="Ex.: Celular usado">

      <label>Preço</label>
      <input id="precoProduto" type="number"
        step="0.01"
        placeholder="Ex.: 700">

      <label>Categoria</label>

      <select id="categoriaProduto">
        <option>Eletrônicos</option>
        <option>Celulares</option>
        <option>Veículos</option>
        <option>Bicicletas</option>
        <option>Roupas</option>
        <option>Casa</option>
        <option>Esportes</option>

      <label>Descrição</label>

      <textarea
        id="descricaoProduto"
        placeholder="Descreva o produto..."
      ></textarea>

      <label>Foto do produto</label>

      <input
        id="fotoProduto"
        type="file"
        accept="image/*"
      >

      <br><br>

      <button
        id="botaoPublicar"
        class="botao"
        onclick="publicarProduto()"
      >
        🚀 Publicar anúncio
      </button>

    </div>

  </section>


  <!-- CHAT -->
  <section id="chat" class="tela">

    <div class="titulo">
      💬 Chat
    </div>

    <div id="chatLoginAviso" class="caixa">

      <h2>Faça login para conversar</h2>

      <br>

      <p>
        Entre na sua conta para conversar com vendedores.
      </p>

      <br>

      <button
        class="botao"
        onclick="abrirTela('perfil')"
      >
        👤 Ir para minha conta
      </button>

    </div>

    <div id="chatConteudo" class="oculto">

      <div class="chat-lista">

        <div class="caixa">
          <h3>Suas conversas</h3>
          <br>
          <div id="listaConversas">
            Nenhuma conversa ainda.
          </div>
        </div>

      </div>

      <div id="chatArea" class="chat-area oculto">

        <div id="chatTitulo" class="chat-topo">
          Conversa
        </div>

        <div id="mensagens"></div>

        <div class="chat-enviar">

          <input
            id="textoMensagem"
            type="text"
            placeholder="Digite uma mensagem..."
          >

          <button onclick="enviarMensagem()">
            ➤
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- PERFIL -->
  <section id="perfil" class="tela">

    <div class="titulo">
      👤 Minha conta
    </div>

    <div id="areaPerfil" class="caixa">

      <h2>Criar conta</h2>

      <br>

      <input
        id="nomeCadastro"
        class="campo"
        type="text"
        placeholder="Seu nome"
      >

      <input
        id="emailCadastro"
        class="campo"
        type="email"
        placeholder="Seu e-mail"
      >

      <input
        id="senhaCadastro"
        class="campo"
        type="password"
        placeholder="Crie uma senha"
      >

      <input
        id="confirmarSenha"
        class="campo"
        type="password"
        placeholder="Confirme sua senha"
      >

      <button
        id="botaoCadastro"
        class="botao"
        onclick="criarContaFirebase()"

      </button>

      <h3>Já possui uma conta?</h3>

      <br>

      <input
        id="emailLogin"
        class="campo"

        placeholder="Seu e-mail"
      >

      <input
        id="senhaLogin"
        class="campo"
        type="password"
        placeholder="Sua senha"
      >

        id="botaoLogin"
        class="botao botao-secundario"
        onclick="entrarFirebase()"

        🔐 Entrar

</main>


<!-- MENU -->
<nav>

  <button onclick="abrirTela('inicio')">
    <span>🏠</span>
    Início
  </button>

  <button onclick="abrirTela('chat')">
    <span>💬</span>
    Chat
  </button>

  <button onclick="abrirTela('vender')">
    <span>➕</span>
    Vender
  </button>

  <button onclick="abrirTela('perfil')">
    <span>👤</span>
    Perfil
  </button>

</nav>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO EXATA ENVIADA POR VOCÊ
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDhdXnJUF3fJpPtfXIPO0geYBB_S0jduUM",

  authDomain:
    "desapegaai-355c2.firebaseapp.com",

  projectId:
    "desapegaai-355c2",

  storageBucket:
    "desapegaai-355c2.firebasestorage.app",

  messagingSenderId:
    "451568442472",

  appId:
    "1:451568442472:web:44f549c6fde6f0621cafdd",

  measurementId:
    "G-DW7QQJ6VJ3"
};


/* =====================================================
   INICIALIZAR
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let conversaAtual = null;

let pararMensagens = null;


/* =====================================================
   FUNÇÕES DE SEGURANÇA
===================================================== */

function escapeHTML(texto) {

  return String(texto || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   TELAS
===================================================== */

window.abrirTela = function(nome) {

  document
    .querySelectorAll(".tela")
    .forEach(function(tela) {

      tela.classList.remove("ativa");

    });

  const tela =
    document.getElementById(nome);

  if (tela) {
    tela.classList.add("ativa");
  }

  window.scrollTo(0, 0);

};


/* =====================================================
   PRODUTOS LOCAIS
===================================================== */

let produtos = [

  {
    nome: "Celular usado",
    preco: 700,
    categoria: "Celulares",
    descricao: "Celular usado em bom estado.",
    foto: "",
    emoji: "📱"
  },

  {
    nome: "Bicicleta usada",
    preco: 450,
    categoria: "Bicicletas",
    descricao: "Bicicleta usada em bom estado.",
    foto: "",
    emoji: "🚲"
  }

];


try {

  const salvos =
    localStorage.getItem("desapegai_produtos");

  if (salvos) {
    produtos = JSON.parse(salvos);
  }

} catch (erro) {

  console.log("Erro nos produtos:", erro);

}


function salvarProdutos() {

  localStorage.setItem(
    "desapegai_produtos",
    JSON.stringify(produtos)
  );

}


function mostrarProdutos(lista) {

  const area =
    document.getElementById("listaProdutos");

  area.innerHTML = "";

  if (!lista.length) {

    area.innerHTML = `
      <div class="sem-produtos">
        <h3>Nenhum produto encontrado.</h3>
        <br>
        <p>Tente outra pesquisa.</p>
      </div>
    `;

    return;
  }


  lista.forEach(function(produto) {

    const card =
      document.createElement("div");

    card.className = "produto";


    let fotoHTML = "";

    if (produto.foto) {

      fotoHTML = `
        <div class="foto-produto">
          <img src="${produto.foto}" alt="Produto">
        </div>
      `;

    } else {

      fotoHTML = `
        <div class="foto-produto">
          ${produto.emoji || "📦"}
        </div>
      `;

    }


    const preco =
      Number(produto.preco || 0)
        .toFixed(2)
        .replace(".", ",");


    card.innerHTML = `

      ${fotoHTML}

      <h2>
        ${escapeHTML(produto.nome)}
      </h2>

      <p class="categoria">
        📁 ${escapeHTML(produto.categoria)}
      </p>

      <p class="descricao">
        ${escapeHTML(produto.descricao)}
      </p>

      <div class="preco">
        R$ ${preco}
      </div>

      <button
        class="botao"
        onclick="falarComVendedor()"
      >
        💬 Falar com vendedor
      </button>

    `;


    area.appendChild(card);

  });

}


document
  .getElementById("pesquisa")
  .addEventListener("input", function() {

    const texto =
      this.value.toLowerCase().trim();


    const resultado =
      produtos.filter(function(produto) {

        return (

          String(produto.nome)
            .toLowerCase()
            .includes(texto)

          ||

          String(produto.categoria)
            .toLowerCase()
            .includes(texto)

          ||

          String(produto.descricao)
            .toLowerCase()
            .includes(texto)

        );

      });


    mostrarProdutos(resultado);

  });


/* =====================================================
   PUBLICAR PRODUTO
===================================================== */

window.publicarProduto = function() {

  const nome =
    document.getElementById("nomeProduto")
      .value.trim();

  const preco =
    document.getElementById("precoProduto")
      .value;

  const categoria =
    document.getElementById("categoriaProduto")
      .value;

  const descricao =
    document.getElementById("descricaoProduto")
      .value.trim();

  const arquivo =
    document.getElementById("fotoProduto")
      .files[0];


  if (!nome) {
    alert("Digite o nome do produto.");
    return;
  }

  if (!preco || Number(preco) <= 0) {
    alert("Digite um preço válido.");
    return;
  }


  if (arquivo) {

    const leitor = new FileReader();

    leitor.onload = function(evento) {

      adicionarProduto(
        nome,
        preco,
        categoria,
        descricao,
        evento.target.result
      );

    };

    leitor.readAsDataURL(arquivo);

  } else {

    adicionarProduto(
      nome,
      preco,
      categoria,
      descricao,
      ""
    );

  }

};


function adicionarProduto(
  nome,
  preco,
  categoria,
  descricao,
  foto
) {

  produtos.unshift({

    nome,
    preco: Number(preco),
    categoria,
    descricao,
    foto,
    emoji: "📦"

  });


  salvarProdutos();

  mostrarProdutos(produtos);


  document.getElementById("nomeProduto").value = "";

  document.getElementById("precoProduto").value = "";

  document.getElementById("descricaoProduto").value = "";

  document.getElementById("fotoProduto").value = "";


  alert("🎉 Anúncio publicado!");

  abrirTela("inicio");

}


/* =====================================================
   CADASTRO
===================================================== */

window.criarContaFirebase = async function() {

  const nome =
    document.getElementById("nomeCadastro")
      .value.trim();

  const email =
    document.getElementById("emailCadastro")
      .value.trim();

  const senha =
    document.getElementById("senhaCadastro")
      .value;

  const confirmar =
    document.getElementById("confirmarSenha")
      .value;

  const mensagem =
    document.getElementById("mensagemCadastro");

  const botao =
    document.getElementById("botaoCadastro");


  mensagem.textContent = "";

  mensagem.className = "mensagem";


  if (!nome || !email || !senha || !confirmar) {

    mensagem.textContent =
      "Preencha todos os campos.";

    mensagem.classList.add("erro");

    return;

  }


  if (senha !== confirmar) {

    mensagem.textContent =
      "As senhas não são iguais.";

    mensagem.classList.add("erro");

    return;

  }


  if (senha.length < 6) {

    mensagem.textContent =
      "A senha precisa ter pelo menos 6 caracteres.";

    mensagem.classList.add("erro");

    return;

  }


  try {

    botao.disabled = true;

    botao.textContent = "Criando conta...";


    const resultado =
      await createUserWithEmailAndPassword(
        auth,
        email,
        senha
      );


    await updateProfile(
      resultado.user,
      {
        displayName: nome
      }
    );


    mensagem.textContent =
      "🎉 Conta criada com sucesso!";

    mensagem.classList.add("sucesso");


    document.getElementById("nomeCadastro").value = "";

    document.getElementById("emailCadastro").value = "";

    document.getElementById("senhaCadastro").value = "";

    document.getElementById("confirmarSenha").value = "";


  } catch (erro) {

    console.error(erro);

    mostrarErroFirebase(erro, mensagem);

  }


  botao.disabled = false;

  botao.textContent =
    "🚀 Criar minha conta";

};


/* =====================================================
   LOGIN
===================================================== */

window.entrarFirebase = async function() {

  const email =
    document.getElementById("emailLogin")
      .value.trim();

  const senha =
    document.getElementById("senhaLogin")
      .value;

  const mensagem =
    document.getElementById("mensagemCadastro");

  const botao =
    document.getElementById("botaoLogin");


  mensagem.textContent = "";

  mensagem.className = "mensagem";


  if (!email || !senha) {

    mensagem.textContent =
      "Digite seu e-mail e sua senha.";

    mensagem.classList.add("erro");

    return;

  }


  try {

    botao.disabled = true;

    botao.textContent = "Entrando...";


    await signInWithEmailAndPassword(
      auth,
      email,
      senha
    );


    mensagem.textContent =
      "✅ Login realizado com sucesso!";

    mensagem.classList.add("sucesso");


  } catch (erro) {

    console.error(erro);

    mostrarErroFirebase(erro, mensagem);

  }


  botao.disabled = false;

  botao.textContent = "🔐 Entrar";

};
