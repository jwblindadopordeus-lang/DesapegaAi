<!-- FIREBASE -->

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
updateProfile,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
CONFIGURAÇÃO FIREBASE
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyDhdXnJUFjPpPtfXIPO0geYBB_S0jduUM",

authDomain:
"desapegaai-355c2.firebaseapp.com",

projectId:
"desapegaai-355c2",

storageBucket:
"desapegaai-355c2.firebasestorage.app",

messagingSenderId:
"451568442472",

appId:
"1:451568442472:web:44f549c6fde6f0621cafdd",

measurementId:
"G-DW7QQJ6VJ3"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================
VARIÁVEIS DO CHAT
========================= */

let usuarioAtual = null;
let conversaAtual = null;
let pararMensagens = null;


/* =========================
UTILIDADES
========================= */

function escapeHTML(texto){

return String(texto || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
CADASTRO
========================= */

window.criarContaFirebase =
async function(){

const nome =
document
.getElementById("nomeCadastro")
.value
.trim();

const email =
document
.getElementById("emailCadastro")
.value
.trim();

const senha =
document
.getElementById("senhaCadastro")
.value;

const confirmar =
document
.getElementById("confirmarSenha")
.value;

const mensagem =
document
.getElementById("mensagemCadastro");

if(!nome || !email || !senha || !confirmar){

mensagem.textContent =
"Preencha todos os campos.";

mensagem.className="mensagem erro";

return;

}

if(senha !== confirmar){

mensagem.textContent =
"As senhas não são iguais.";

mensagem.className="mensagem erro";

return;

}

if(senha.length < 6){

mensagem.textContent =
"A senha precisa ter pelo menos 6 caracteres.";

mensagem.className="mensagem erro";

return;

}

try{

const resultado =
await createUserWithEmailAndPassword(
auth,
email,
senha
);

await updateProfile(
resultado.user,
{
displayName:nome
}
);


/* SALVAR PERFIL NO FIRESTORE */

await setDoc(
doc(db,"users",resultado.user.uid),
{
uid:resultado.user.uid,
nome:nome,
email:email,
criadoEm:serverTimestamp()
}
);

mensagem.textContent =
"🎉 Conta criada com sucesso!";

mensagem.className="mensagem sucesso";


}catch(erro){

console.error(erro);

mensagem.textContent =
traduzirErro(erro);

mensagem.className="mensagem erro";

}

};


/* =========================
LOGIN
========================= */

window.entrarConta =
async function(){

const email =
document
.getElementById("emailLogin")
.value
.trim();

const senha =
document
.getElementById("senhaLogin")
.value;

const mensagem =
document
.getElementById("mensagemCadastro");

if(!email || !senha){

mensagem.textContent =
"Digite seu e-mail e senha.";

mensagem.className="mensagem erro";

return;

}

try{

await signInWithEmailAndPassword(
auth,
email,
senha
);

mensagem.textContent =
"✅ Login realizado!";

mensagem.className="mensagem sucesso";

}catch(erro){

console.error(erro);

mensagem.textContent =
traduzirErro(erro);

mensagem.className="mensagem erro";

}

};


/* =========================
AUTENTICAÇÃO
========================= */

onAuthStateChanged(
auth,
async function(usuario){

usuarioAtual=usuario;

const area =
document.getElementById("areaPerfil");

const chatLogin =
document.getElementById("chatLoginAviso");

const chatArea =
document.getElementById("chatArea");

if(usuario){

chatLogin.style.display="none";
chatArea.style.display="block";

area.innerHTML=`

<div class="usuario-logado">

<h2>
👋 Olá, ${escapeHTML(
usuario.displayName ||
usuario.email
)}!
</h2>

<br>

<p>📧 ${escapeHTML(usuario.email)}</p>

<br>

<p>✅ Conta conectada</p>

</div>

<button
class="botao"
onclick="sairDaConta()"
>
🚪 Sair da conta
</button>

`;

}else{

chatLogin.style.display="block";
chatArea.style.display="none";

}

});


/* =========================
SAIR
========================= */

window.sairDaConta =
async function(){

try{

await signOut(auth);

if(pararMensagens){

pararMensagens();

pararMensagens=null;

}

conversaAtual=null;

alert("Você saiu da conta.");

}catch(erro){

alert(
"Não foi possível sair da conta."
);

}

};


/* =========================
ABRIR CONVERSA
========================= */

window.abrirConversa =
async function(){

if(!usuarioAtual){

alert(
"Entre na sua conta primeiro."
);

return;

}

const email =
document
.getElementById("emailDestinatario")
.value
.trim()
.toLowerCase();

if(!email){

alert(
"Digite o e-mail do usuário."
);

return;

}

if(email === usuarioAtual.email.toLowerCase()){

alert(
"Você não pode conversar consigo mesmo."
);

return;

}

try{

const usuariosRef =
collection(db,"users");

const q =
query(
usuariosRef,
where("email","==",email)
);

const resultado =
await new Promise(
(resolve,reject)=>{

const parar =
onSnapshot(
q,
(snapshot)=>{

parar();

resolve(snapshot);

},
reject
);

}
);

if(resultado.empty){

alert(
"Usuário não encontrado."
);

return;

}

const destinatario =
resultado.docs[0].data();

const ids=[
usuarioAtual.uid,
destinatario.uid
].sort();

conversaAtual =
ids[0]+"_"+ids[1];

await setDoc(
doc(
db,
"conversations",
conversaAtual
),
{
participants:ids,
participantsEmails:{
[usuarioAtual.uid]:
usuarioAtual.email,
[destinatario.uid]:
destinatario.email
},
updatedAt:serverTimestamp()
},
{merge:true}
);

document.getElementById(
"chatComQuem"
).textContent =
"💬 Conversando com "+
(destinatario.nome ||
destinatario.email);

ouvirMensagens();

}catch(erro){

console.error(erro);

alert(
"Não foi possível abrir a conversa: "+
erro.code
);

}

};


/* =========================
OUVIR MENSAGENS
========================= */

function ouvirMensagens(){

if(pararMensagens){

pararMensagens();

}

const mensagensRef =
collection(
db,
"conversations",
conversaAtual,
"messages"
);

const q =
query(
mensagensRef,
orderBy("criadoEm","asc")
);

pararMensagens =
onSnapshot(
q,
(snapshot)=>{

const area =
document.getElementById(
"listaMensagens"
);

area.innerHTML="";

snapshot.forEach(
(docSnap)=>{

const msg =
docSnap.data();

const div =
document.createElement("div");

div.className =
"mensagem-chat";

if(
msg.uid ===
usuarioAtual.uid
){

div.classList.add(
"mensagem-minha"
);

}

div.innerHTML=`

${escapeHTML(msg.texto)}

<small>
${escapeHTML(msg.nome || "")}
</small>

`;

area.appendChild(div);

});

area.scrollTop =
area.scrollHeight;

},
(erro)=>{

console.error(erro);

alert(
"Erro ao carregar mensagens: "+
erro.code
);

}

);

}


/* =========================
ENVIAR MENSAGEM
========================= */

window.enviarMensagem =
async function(){

if(!usuarioAtual){

alert(
"Entre na sua conta."
);

return;

}

if(!conversaAtual){

alert(
"Abra uma conversa primeiro."
);

return;

}

const campo =
document.getElementById(
"mensagemChat"
);

const texto =
campo.value.trim();

if(!texto){

return;

}

try{

await addDoc(
collection(
db,
"conversations",
conversaAtual,
"messages"
),
{
uid:usuarioAtual.uid,
nome:
usuarioAtual.displayName ||
usuarioAtual.email,
texto:texto,
criadoEm:serverTimestamp()
}
);

await setDoc(
doc(
db,
"conversations",
conversaAtual
),
{
updatedAt:serverTimestamp()
},
{merge:true}
);

campo.value="";

}catch(erro){

console.error(erro);

alert(
"Não foi possível enviar a mensagem: "+
erro.code
);

}

};


/* =========================
ERROS DO FIREBASE
========================= */

function traduzirErro(erro){

switch(erro.code){

case "auth/email-already-in-use":
return "Este e-mail já possui uma conta.";

case "auth/invalid-email":
return "Digite um e-mail válido.";

case "auth/weak-password":
return "A senha precisa ter pelo menos 6 caracteres.";

case "auth/invalid-credential":
return "E-mail ou senha incorretos.";

case "auth/user-not-found":
return "Usuário não encontrado.";

case "auth/wrong-password":
return "Senha incorreta.";

case "auth/operation-not-allowed":
return "Ative E-mail/senha no Firebase Authentication.";

case "auth/api-key-not-valid":
return "A API key do Firebase está inválida.";

case "permission-denied":
return "Permissão negada pelo Firestore. Verifique as regras.";

default:
return "Erro: "+(erro.code || "desconhecido");

}

}

</script>


<script>

/* =========================
PRODUTOS LOCAIS
========================= */

let produtos=[
{
nome:"Celular usado",
preco:700,
categoria:"Celulares",
descricao:"Celular usado em bom estado.",
foto:"",
emoji:"📱"
},
{
nome:"Bicicleta usada",
preco:450,
categoria:"Bicicletas",
descricao:"Bicicleta usada em bom estado.",
foto:"",
emoji:"🚲"
}
];

const salvos =
localStorage.getItem(
"desapegai_produtos"
);

if(salvos){

try{
produtos=JSON.parse(salvos);
}catch(e){}

}

function salvarProdutos(){

localStorage.setItem(
"desapegai_produtos",
JSON.stringify(produtos)
);

}

function mostrarProdutos(lista){

const area =
document.getElementById(
"listaProdutos"
);

area.innerHTML="";

if(!lista.length){

area.innerHTML=`
<div class="sem-produtos">
<h3>Nenhum produto encontrado.</h3>
<br>
<p>Tente pesquisar outro produto.</p>
</div>
`;

return;

}

lista.forEach(produto=>{

const card =
document.createElement("div");

card.className="produto";

const imagem =
produto.foto
?
`
<div class="foto-produto">
<img src="${produto.foto}">
</div>
`
:
`
<div class="foto-produto">
${produto.emoji || "📦"}
</div>
`;

card.innerHTML=`

${imagem}

<h2>
${escapeHTMLLocal(produto.nome)}
</h2>

<p class="categoria">
📁 ${escapeHTMLLocal(produto.categoria)}
</p>

<p class="descricao">
${escapeHTMLLocal(produto.descricao)}
</p>

<div class="preco">
R$ ${Number(produto.preco)
.toFixed(2)
.replace(".",",")}
</div>

<button
class="botao"
onclick="abrirTela('chat')"
>
💬 Falar com vendedor
</button>

`;

area.appendChild(card);

});

}

function escapeHTMLLocal(texto){

return String(texto || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function publicarProduto(){

const nome =
document.getElementById(
"nomeProduto"
).value.trim();

const preco =
document.getElementById(
"precoProduto"
).value;

const categoria =
document.getElementById(
"categoriaProduto"
).value;

const descricao =
document.getElementById(
"descricaoProduto"
).value.trim();

const arquivo =
document.getElementById(
"fotoProduto"
).files[0];

if(!nome){

alert("Digite o nome do produto.");

return;

}

if(!preco || Number(preco)<=0){

alert("Digite um preço válido.");

return;

}

function adicionar(foto){

produtos.unshift({
nome,
preco:Number(preco),
categoria,
descricao,
foto,
emoji:"📦"
});

salvarProdutos();

mostrarProdutos(produtos);

document.getElementById(
"nomeProduto"
).value="";

document.getElementById(
"precoProduto"
).value="";

document.getElementById(
"descricaoProduto"
).value="";

document.getElementById(
"fotoProduto"
).value="";

alert(
"🎉 Anúncio publicado!"
);

abrirTela("inicio");

}

if(arquivo){

const leitor =
new FileReader();

leitor.onload =
e=>adicionar(e.target.result);

leitor.readAsDataURL(arquivo);

}else{

adicionar("");

}

}

document
.getElementById("pesquisa")
.addEventListener(
"input",
function(){

const texto =
