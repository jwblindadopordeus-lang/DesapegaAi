function escapar(texto){

  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

window.criarConta = async function(){

  const nome =
    document
      .getElementById("nomeCadastro")
      .value
      .trim();

  const email =
    document
      .getElementById("emailCadastro")
      .value
      .trim();

  const senha =
    document
      .getElementById("senhaCadastro")
      .value;

  const confirmar =
    document
      .getElementById("confirmarSenha")
      .value;

  const mensagem =
    document
      .getElementById("mensagemCadastro");

  const botao =
    document
      .getElementById("botaoCadastro");


  mensagem.textContent = "";
  mensagem.className = "mensagem";


  if(!nome || !email || !senha || !confirmar){

    mensagem.textContent =
      "Preencha todos os campos.";

    mensagem.classList.add("erro");

    return;

  }


  if(senha !== confirmar){

    mensagem.textContent =
      "As senhas não são iguais.";

    mensagem.classList.add("erro");

    return;

  }


  if(senha.length < 6){

    mensagem.textContent =
      "A senha precisa ter pelo menos 6 caracteres.";

    mensagem.classList.add("erro");

    return;

  }


  if(!auth){

    mensagem.textContent =
      "Firebase não foi inicializado. Confira a configuração.";

    mensagem.classList.add("erro");

    return;

  }


  try{

    botao.disabled = true;

    botao.textContent =
      "Criando conta...";


    const resultado =
      await createUserWithEmailAndPassword(
        auth,
        email,
        senha
      );


    await updateProfile(
      resultado.user,
      {
        displayName:nome
      }
    );


    mensagem.textContent =
      "🎉 Conta criada com sucesso!";

    mensagem.classList.add("sucesso");


  }catch(erro){

    console.error(
      "Erro no cadastro:",
      erro
    );

    mensagem.textContent =
      traduzirErro(erro);

    mensagem.classList.add("erro");


  }finally{

    botao.disabled = false;

    botao.textContent =
      "🚀 Criar minha conta";

  }

};

/* =====================================================
   TRADUZIR ERROS
===================================================== */

function traduzirErro(erro){

  const codigo =
    erro?.code || "";

  if(
    codigo.includes("invalid-api-key") ||
    codigo.includes("api-key-not-valid")
  ){

    return "A chave da API do Firebase está inválida. Copie novamente a configuração do seu app no Firebase.";

  }

  if(
    codigo ===
    "auth/email-already-in-use"
  ){

    return "Este e-mail já possui uma conta.";

  }

  if(
    codigo ===
    "auth/invalid-email"
  ){

    return "Digite um e-mail válido.";

  }

  if(
    codigo ===
    "auth/weak-password"
  ){

    return "A senha precisa ter pelo menos 6 caracteres.";

  }

  if(
    codigo ===
    "auth/invalid-credential"
  ){

    return "E-mail ou senha incorretos.";

  }

  if(
    codigo ===
    "auth/user-not-found"
  ){

    return "Usuário não encontrado.";

  }

  if(
    codigo ===
    "auth/wrong-password"
  ){

    return "Senha incorreta.";

  }

  if(
    codigo ===
    "auth/operation-not-allowed"
  ){

    return "Ative o provedor E-mail/senha no Firebase Authentication.";

  }

  if(
    codigo ===
    "auth/network-request-failed"
  ){

    return "Erro de conexão com a internet.";

  }

  if(
    codigo ===
    "permission-denied"
  ){

    return "O Firebase bloqueou o acesso. Verifique as regras do Firestore.";

  }

  return "Erro do Firebase: " + codigo;

}

/* =====================================================
   PRODUTOS
===================================================== */

async function carregarProdutos(){

  const area =
    document.getElementById("listaProdutos");


  if(!area){

    return;

  }


  area.innerHTML =
    '<div class="vazio">Carregando produtos...</div>';


  if(!db){

    area.innerHTML =
      '<div class="vazio">Firebase não foi iniciado.</div>';

    return;

  }


  try{

    const consulta =
      query(
        collection(db,"produtos"),
        orderBy("criadoEm","desc")
      );


    const resultado =
      await getDocs(consulta);


    const produtos = [];


    resultado.forEach(doc => {

      produtos.push({
        id:doc.id,
        ...doc.data()
      });

    });


    mostrarProdutos(produtos);


  }catch(erro){

    console.error(
      "Erro produtos:",
      erro
    );


    /*
      Caso o índice do Firestore ainda não exista,
      tentamos carregar sem orderBy.
    */

    try{

      const resultado =
        await getDocs(
          collection(db,"produtos")
        );


      const produtos = [];


      resultado.forEach(doc => {

        produtos.push({
          id:doc.id,
          ...doc.data()
        });

      });


      produtos.sort(
        (a,b) =>
          (b.criadoEm?.seconds || 0) -
          (a.criadoEm?.seconds || 0)
      );


      mostrarProdutos(produtos);


    }catch(segundoErro){

      console.error(
        segundoErro
      );


      area.innerHTML = `

        <div class="vazio">

          Não foi possível carregar os anúncios.

          <br><br>

          Verifique se o Firestore
          está ativado no Firebase.

        </div>

      `;

    }

  }

}


/* =====================================================

===================================================== */

function mostrarProdutos(produtos){

  const area =

  area.innerHTML = "";


  if(!produtos.length){

    area.innerHTML =
      '<div class="vazio">Nenhum anúncio publicado ainda.</div>';

    return;

  }


  produtos.forEach(produto => {

    const card =
      document.createElement("div");


    card.className =
      "produto";


    let foto =
      "📦";


    if(produto.foto){

      foto =
        `<img src="${escapar(produto.foto)}" alt="Produto">`;

    }


    const preco =
      Number(produto.preco || 0)
        .toFixed(2)
        .replace(".",",");


    card.innerHTML = `

      <div class="foto">
        ${foto}
      </div>

      <h2>
        ${escapar(produto.nome)}
      </h2>

      <p class="categoria">
        📁 ${escapar(produto.categoria)}
      </p>

      <p class="descricao">
        ${escapar(produto.descricao)}
      </p>

      <div class="preco">
        R$ ${preco}
      </div>

      <p style="font-size:13px;color:#888">
        Vendedor:
        ${escapar(produto.nomeVendedor || "Usuário")}
      </p>

      <button class="botao">
        💬 Falar com vendedor
      </button>

    `;


    card
      .querySelector("button")
      .onclick = () => {

        abrirChatProduto(produto);

      };


    area.appendChild(card);

  });

}
